---
name: Build

on:
  push:
    branches:
      - master
      - dev
      - "bugfix-release/*"
      - "release/*"
    tags:
      # Moving this one tag is what cuts a release. There is no tag per
      # version - the version is the build timestamp, see the "version" job.
      - latest
  pull_request:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - nightly
          - stable
  merge_group:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  C2_ENABLE_LTO: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/bugfix-release/') || startsWith(github.ref, 'refs/heads/release/') }}
  CHATTERINO_REQUIRE_CLEAN_GIT: On
  # A release must never be a nightly build: nightlies refuse to auto-update and
  # send the user to a browser instead. The `latest` tag carries no version, so
  # the "Determine build type" step can't work this out on its own.
  CHATTERINO_BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || case(inputs.buildType != '', inputs.buildType, 'auto') }}
  CONAN_VERSION: 2.28.1

jobs:
  version:
    name: "Determine version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            # Not a release. An empty version makes cmake/ForkVersion.cmake mark
            # the build as development, which never auto-updates.
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Not a release build."
            exit 0
          fi

          # The version is the build timestamp: YYYY.MMDD.HHMM, e.g. 2026.809.1425.
          #
          # Worked out once here and handed to every job, so all platforms in one
          # release report the same version rather than whatever the clock said
          # when each job happened to start.
          #
          # 10# strips the leading zeros: semver rejects "0809", and without the
          # time component two releases on one day would collide and clients
          # would never see the second one.
          day=$(date -u +%m%d)
          time=$(date -u +%H%M)
          version="$(date -u +%Y).$((10#$day)).$((10#$time))"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  build-ubuntu-docker:
    # Our Ubuntu builds are built using Docker images that have been pre-published.
    # This speeds up builds for us since we do some pre-building of packages that takes a long time
    # However, this means if you need to add a dependency to the build, you'll need to do that
    # in the https://github.com/Chatterino/docker repository first.
    name: "Build Ubuntu in Docker"
    needs: [version]
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            container: ghcr.io/chatterino/chatterino2-build-ubuntu-22.04:latest
            force-lto: false
            skip-artifact: false
            skip-crashpad: false
            build-deb: true
            plugins: true
          - os: ubuntu-24.04
            container: ghcr.io/chatterino/chatterino2-build-ubuntu-24.04:latest
            force-lto: false
            skip-artifact: false
            skip-crashpad: false
            build-deb: true
            plugins: true
          - os: ubuntu-24.04
            container: ghcr.io/chatterino/chatterino2-build-ubuntu-24.04:latest
            force-lto: false
            skip-artifact: false
            skip-crashpad: false
            build-deb: false
            plugins: false
          - os: ubuntu-26.04
            container: ghcr.io/chatterino/chatterino2-build-ubuntu-26.04:latest
            force-lto: false
            skip-artifact: false
            skip-crashpad: false
            build-deb: true
            plugins: true
    env:
      C2_ENABLE_LTO: ${{ matrix.force-lto }}
      C2_ENABLE_CRASHPAD: ${{ matrix.skip-crashpad == false }}
      # Read by cmake/ForkVersion.cmake. Empty outside releases, which marks the
      # build as development so it never auto-updates.
      CHATTERINO_FORK_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # allows for tags access

      - name: Fix git permission error
        run: |
          find . -name "SeventvAPI.cpp" -exec sed -i "s|proxy_placeholder|${{ secrets.SEVENTV_PROXY }}|g" {} +
          find . -name "SeventvEmotes.cpp" -exec sed -i "s|proxy_placeholder|${{ secrets.SEVENTV_PROXY }}|g" {} +
          find . -name "Updates.cpp" -exec sed -i "s|update_url_placeholder|${{ secrets.UPDATE_URL }}|g" {} +
          git config --global --add safe.directory '*'

      - name: Determine build type
        id: build-type
        shell: bash
        run: |
          if [ "${CHATTERINO_BUILD_TYPE}" = "auto" ]; then
            if git describe --exact-match --match 'v*'; then
              echo "Auto - found release tag format"
              echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
            else
              echo "Auto - did not find release tag format"
              echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${CHATTERINO_BUILD_TYPE}" = "nightly" ]; then
            echo "Override to nightly"
            echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
          elif [ "${CHATTERINO_BUILD_TYPE}" = "stable" ]; then
            echo "Override to stable"
            echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
          else
            echo "Error: no build type variable set"
            exit 1
          fi

      - name: Build
        run: |
          mkdir build
          cd build
          CXXFLAGS=-fno-sized-deallocation cmake \
            -DCMAKE_INSTALL_PREFIX=appdir/usr/ \
            -DCMAKE_BUILD_TYPE=Release \
            -DPAJLADA_SETTINGS_USE_BOOST_FILESYSTEM=On \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=On \
            -DCHATTERINO_LTO="$C2_ENABLE_LTO" \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR/lib/cmake" \
            -DCHATTERINO_STATIC_QT_BUILD=On \
            -DCHATTERINO_NIGHTLY_BUILD=${{ steps.build-type.outputs.NIGHTLY_BUILD }} \
            -DFORCE_JSON_GENERATION=Off \
            -DCHATTERINO_PLUGINS=${{ case(matrix.plugins, 'On', 'Off') }} \
            ..
          make -j"$(nproc)"

      - name: Package - .deb (Ubuntu)
        if: matrix.build-deb
        run: |
          cd build
          sh ./../.CI/CreateUbuntuDeb.sh

      - name: Upload artifact - .deb (Ubuntu)
        if: matrix.build-deb
        uses: actions/upload-artifact@v7
        with:
          name: Chatterino-${{ matrix.os }}.deb
          path: build/Chatterino-${{ matrix.os }}-x86_64.deb

  build:
    name: "Build ${{ matrix.os }}, Qt ${{ matrix.qt-version }} (LTO:${{ matrix.force-lto }}, crashpad:${{ case(matrix.skip-crashpad, 'off', 'on') }})"
    needs: [version]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS
          - os: macos-26
            qt-version: 6.11.1
            force-lto: false
            skip-artifact: false
            skip-crashpad: false
          # Windows
          - os: windows-latest
            qt-version: 6.8.3
            force-lto: false
            skip-artifact: false
            skip-crashpad: false

      fail-fast: false
    env:
      C2_ENABLE_LTO: ${{ matrix.force-lto }}
      C2_ENABLE_CRASHPAD: ${{ matrix.skip-crashpad == false }}
      # Read by cmake/ForkVersion.cmake. Empty outside releases, which marks the
      # build as development so it never auto-updates.
      CHATTERINO_FORK_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # allows for tags access

      - name: Determine build type
        id: build-type
        shell: bash
        run: |
          if [ "${CHATTERINO_BUILD_TYPE}" = "auto" ]; then
            if git describe --exact-match --match 'v*'; then
              echo "Auto - found release tag format"
              echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
            else
              echo "Auto - did not find release tag format"
              echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${CHATTERINO_BUILD_TYPE}" = "nightly" ]; then
            echo "Override to nightly"
            echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
          elif [ "${CHATTERINO_BUILD_TYPE}" = "stable" ]; then
            echo "Override to stable"
            echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
          else
            echo "Error: no build type variable set"
            exit 1
          fi

      - name: Install Qt6
        if: startsWith(matrix.qt-version, '6.')
        uses: jurplel/install-qt-action@v4.3.1
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache-${{ matrix.qt-version }}-v2
          modules: qtimageformats
          version: ${{ matrix.qt-version }}

      - name: Set proxy.
        if: startsWith(matrix.os, 'linux') || startsWith(matrix.os, 'windows')
        run: |
          find . -name "SeventvAPI.cpp" -exec sed -i "s|proxy_placeholder|${{ secrets.SEVENTV_PROXY }}|g" {} +
          find . -name "SeventvEmotes.cpp" -exec sed -i "s|proxy_placeholder|${{ secrets.SEVENTV_PROXY }}|g" {} +
          find . -name "Updates.cpp" -exec sed -i "s|update_url_placeholder|${{ secrets.UPDATE_URL }}|g" {} +
        shell: bash

      - name: Set proxy.
        if: startsWith(matrix.os, 'macos')
        run: |
          find . -name "SeventvAPI.cpp" -exec sed -i '' "s|proxy_placeholder|${{ secrets.SEVENTV_PROXY }}|g" {} +
          find . -name "SeventvEmotes.cpp" -exec sed -i '' "s|proxy_placeholder|${{ secrets.SEVENTV_PROXY }}|g" {} +
          find . -name "Updates.cpp" -exec sed -i '' "s|update_url_placeholder|${{ secrets.UPDATE_URL }}|g" {} +
        shell: bash

      # WINDOWS
      - name: Enable Developer Command Prompt (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: Chatterino/msvc-dev-cmd@v2.0.7

      - name: Setup sccache (Windows)
        # sccache v0.7.4
        uses: hendrikmuhs/ccache-action@v1.2.23
        if: startsWith(matrix.os, 'windows')
        with:
          variant: sccache
          # only save on on the default (master) branch
          save: ${{ github.event_name == 'push' }}
          key: sccache-build-${{ matrix.os }}-${{ matrix.qt-version }}-${{ matrix.skip-crashpad }}
          restore-keys: |
            sccache-build-${{ matrix.os }}-${{ matrix.qt-version }}

      - name: Cache conan packages (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-conan-user-${{ hashFiles('**/conanfile.py') }}-QT6
          path: ~/.conan2/

      - name: Install Conan (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          python3 -c "import site; import sys; print(f'{site.USER_BASE}\\Python{sys.version_info.major}{sys.version_info.minor}\\Scripts')" >> "$GITHUB_PATH"
          pip3 install --user "conan==${{ env.CONAN_VERSION }}"
        shell: powershell

      - name: Setup Conan (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          conan --version
          conan profile detect -f
        shell: powershell

      - name: Install dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          mkdir build
          cd build
          conan install .. `
              -s build_type=RelWithDebInfo `
              -c tools.cmake.cmaketoolchain:generator="NMake Makefiles" `
              -b missing `
              --output-folder=. `
              -o with_openssl3="True"
        shell: powershell

      - name: Build (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          cd build
          cmake `
              -G"NMake Makefiles" `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
              -DUSE_PRECOMPILED_HEADERS=ON `
              -DBUILD_WITH_CRASHPAD="$Env:C2_ENABLE_CRASHPAD" `
              -DCHATTERINO_LTO="$Env:C2_ENABLE_LTO" `
              -DCHATTERINO_NIGHTLY_BUILD="${{ steps.build-type.outputs.NIGHTLY_BUILD }}" `
              -DFORCE_JSON_GENERATION=Off `
              -DCHATTERINO_SPELLCHECK=On `
              ..
          set cl=/MP
          nmake /S /NOLOGO

      - name: Build crashpad (Windows)
        if: startsWith(matrix.os, 'windows') && !matrix.skip-crashpad
        shell: pwsh
        run: |
          cd build
          set cl=/MP
          nmake /S /NOLOGO chatterino-crash-handler
          mkdir Chatterino2/crashpad
          cp bin/crashpad/crashpad-handler.exe Chatterino2/crashpad/crashpad-handler.exe
          7z a bin/chatterino-Qt-${{ matrix.qt-version }}.pdb.7z bin/chatterino.pdb

      - name: Prepare build dir (windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          cd build
          windeployqt bin/chatterino.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --force-openssl --dir Chatterino2/
          cp bin/chatterino.exe Chatterino2/
          ..\.CI\deploy-crt.ps1 Chatterino2

      - name: Package (windows)
        if: startsWith(matrix.os, 'windows')
        working-directory: build
        run: |
          7z a chatterino-windows-x86-64-Qt-${{ matrix.qt-version }}.zip Chatterino2/

      - name: Upload artifact (Windows - binary)
        if: startsWith(matrix.os, 'windows') && !matrix.skip-artifact
        uses: actions/upload-artifact@v7
        with:
          name: chatterino-windows-x86-64-Qt-${{ matrix.qt-version }}.zip
          path: build/chatterino-windows-x86-64-Qt-${{ matrix.qt-version }}.zip

      - name: Upload artifact (Windows - symbols)
        if: startsWith(matrix.os, 'windows') && !matrix.skip-artifact
        uses: actions/upload-artifact@v7
        with:
          name: chatterino-windows-x86-64-Qt-${{ matrix.qt-version }}-symbols.pdb.7z
          path: build/bin/chatterino-Qt-${{ matrix.qt-version }}.pdb.7z

      - name: Clean Conan cache
        if: startsWith(matrix.os, 'windows')
        run: conan cache clean --source --build --download "*"
        shell: bash

      # MACOS
      - name: Install dependencies (MacOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # brew install openssl rapidjson p7zip create-dmg cmake tree boost hunspell
          brew install openssl rapidjson p7zip create-dmg tree boost hunspell
        shell: bash

      - name: Build (MacOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir build
          cd build
          cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
              -DOPENSSL_ROOT_DIR=/usr/local/opt/openssl \
              -DUSE_PRECOMPILED_HEADERS=OFF \
              -DCHATTERINO_LTO="$C2_ENABLE_LTO" \
              -DFORCE_JSON_GENERATION=Off \
              -DCHATTERINO_NIGHTLY_BUILD=${{ steps.build-type.outputs.NIGHTLY_BUILD }} \
              -DCHATTERINO_SPELLCHECK=On \
              ..
          make -j"$(sysctl -n hw.logicalcpu)"
        shell: bash

      - name: Package (MacOS)
        if: startsWith(matrix.os, 'macos')
        env:
          OUTPUT_DMG_PATH: chatterino-macos-Qt-${{ matrix.qt-version}}.dmg
        run: |
          ls -la
          pwd
          ls -la build || true
          cd build
          ./../.CI/MacDeploy.sh
          ./../.CI/CreateDMG.sh
        shell: bash

      - name: Upload artifact (MacOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: chatterino-macos-Qt-${{ matrix.qt-version }}.dmg
          path: build/chatterino-macos-Qt-${{ matrix.qt-version }}.dmg

  create-release:
    needs: [version, build-ubuntu-docker, build]
    runs-on: ubuntu-latest
    # Two rolling releases: the nightly off master, and `latest`, which is the
    # one clients update themselves to.
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')))

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # allows for tags access

      - uses: actions/download-artifact@v8
        name: Download artifacts
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Copy flatpakref
        run: |
          cp .CI/chatterino-nightly.flatpakref release-artifacts/
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Format changes
        id: format-changes
        run: |
          delimiter=$(openssl rand -hex 32)
          {
            echo "changelog<<$delimiter"
            python3 ./.CI/format-recent-changes.py
            echo $delimiter
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create release
        uses: ncipollo/release-action@v1.21.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ steps.format-changes.outputs.changelog }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # One release that gets rewritten in place; the version lives in its
          # name, since the tag no longer carries one.
          name: ${{ startsWith(github.ref, 'refs/tags/') && needs.version.outputs.version || 'Nightly Release' }}
          tag: ${{ startsWith(github.ref, 'refs/tags/') && 'latest' || 'nightly-build' }}

      - name: Update nightly-build tag
        if: github.ref == 'refs/heads/master'
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
        shell: bash

  deploy:
    needs: [version, create-release]
    runs-on: ubuntu-latest
    # Nightlies keep being mirrored to the server for manual download; only the
    # version endpoint below is restricted to releases.
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')))
    steps:
      - uses: robinraju/release-downloader@v1
        with:
          tag: ${{ startsWith(github.ref, 'refs/tags/') && 'latest' || 'nightly-build' }}
          fileName: '*'
          out-file-path: 'myassets'

      - name: Upload assets to server
        env:
          RSYNC_PASSWORD: ${{ secrets.RSYNC_PASSWORD }} # Set this in your repository secrets
          SSHPASS: ${{ secrets.RSYNC_PASSWORD }} # Use the same password for sshpass
        run: |
          cd myassets

          rm *flatpakref*
          rm *pdb*

          # Use rsync to upload to the server
          rsync -avz --progress -e "sshpass -e ssh -o StrictHostKeyChecking=no" ./* root@${{ secrets.SERVER_IP }}:/var/www/html/chatterino/

          # Path to the source template file and the target output file
          template_file="template.html"
          output_file="index.html"

          wget -O ${template_file} ${{ secrets.SERVER_IP }}/chatterino/${template_file}

          # Create a temporary file for the HTML list
          temp_html_list=$(mktemp)

          # Create the HTML list of files
          echo "<ul>" > "$temp_html_list"
          echo "<li>Updated on $(date)</li>" >> "$temp_html_list"

          # Iterate over all files in the current directory
          for file in $(ls -1 . | grep -v -E "pdb|flatpakref|html" | tac); do
              echo "<li><a href=\"./$file\">$file</a></li>" >> "$temp_html_list"
          done

          echo "</ul>" >> "$temp_html_list"

          # Read the content of the template file into a variable
          template_content=$(<"$template_file")

          # Read the HTML list into a variable
          html_content=$(<"$temp_html_list")

          # Replace MY_TEMPLATE with the HTML list in the template content
          output_content="${template_content//MY_TEMPLATE/$html_content}"

          # Write the output content to the output file
          echo "$output_content" > "$output_file"

          # Send the file using rsync
          rsync -avz --progress -e "sshpass -e ssh -o StrictHostKeyChecking=no" "$output_file" root@${{ secrets.SERVER_IP }}:/var/www/html/chatterino/

          # Remove the temporary file
          rm "$temp_html_list"

          echo "The index.html file has been successfully updated and sent."

      - name: Update version endpoint
        # Tags only: this is what clients update themselves to, so it must never
        # be pointed at an untagged build (which reports itself as 0.0.0).
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SSHPASS: ${{ secrets.RSYNC_PASSWORD }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # Same value the binaries were built with, so what the endpoint
          # advertises is exactly what the app reports about itself.
          if [ -z "$VERSION" ]; then
            echo "No version was determined for this run - refusing to publish." >&2
            exit 1
          fi

          # Still the ssh/rsync target below - only the public URLs stopped
          # being built out of it.
          SERVER="${{ secrets.SERVER_IP }}"

          # Downloads have to come from the same origin the client already
          # reaches for this very JSON, so derive one from the other instead of
          # rebuilding it out of SERVER_IP. SERVER_IP is a bare IP meant for
          # ssh/rsync: an https:// URL built from it fails certificate
          # validation, and the files sit at the web root rather than under
          # /chatterino. That combination silently shipped download links that
          # every client failed on.
          BASE_URL="${UPDATE_URL%/}"
          BASE_URL="${BASE_URL%/version}"
          if [ "$BASE_URL" = "${UPDATE_URL%/}" ]; then
            echo "UPDATE_URL ('$UPDATE_URL') does not end in /version, so the download base URL cannot be derived from it." >&2
            exit 1
          fi

          # Discover the artifact names instead of hardcoding them: they carry
          # the Qt version, which changes whenever CI bumps Qt.
          cd myassets
          WIN_ZIP=$(ls -1 chatterino-windows-x86-64-Qt-*.zip | head -1)
          MAC_DMG=$(ls -1 chatterino-macos-Qt-*.dmg | head -1)
          cd ..

          echo "Publishing $VERSION (windows: $WIN_ZIP, macos: $MAC_DMG)"

          # Fail here rather than publish an endpoint clients choke on. Uses the
          # same TLS validation the app does, so a bad host or certificate is
          # caught now instead of showing up as "Failed to download the update".
          for file in "$WIN_ZIP" "$MAC_DMG"; do
            if ! curl -fsSI --max-time 60 "$BASE_URL/$file" >/dev/null; then
              echo "$BASE_URL/$file is not downloadable - refusing to publish the endpoint." >&2
              exit 1
            fi
          done

          for os in win macos linux; do
            JSON="{\"version\":\"$VERSION\""
            if [ "$os" = "win" ]; then
              # Both point at the portable zip: it is a plain file tree, which is
              # what the silent updater merges over the installation.
              JSON="$JSON,\"updateexe\":\"$BASE_URL/$WIN_ZIP\",\"portable_download\":\"$BASE_URL/$WIN_ZIP\""
            elif [ "$os" = "macos" ]; then
              JSON="$JSON,\"updateexe\":\"$BASE_URL/$MAC_DMG\""
            elif [ "$os" = "linux" ]; then
              JSON="$JSON,\"updateguide\":\"$BASE_URL/\""
            fi
            JSON="$JSON}"

            # Written to both channels so the "receive beta updates" toggle
            # doesn't point users at a 404.
            for channel in stable beta; do
              echo "$JSON" | sshpass -e ssh -o StrictHostKeyChecking=no root@$SERVER "cat > /var/www/html/chatterino/version/$os/$channel"
            done
          done
          echo "Version endpoint updated to $VERSION."

      - name: Notify
        run: |
          curl -s -X POST "${{ secrets.WEBHOOK_URL }}" \
          -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}"
